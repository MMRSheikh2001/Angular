<div class="container mt-4">
    <div class="row">
        <div *ngFor="let t of teachers,let i=index" class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <!-- Header with ID and Designation -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <small class="text-muted fw-bold">ID: {{ i+1 }}</small>
                        <span class="badge bg-info text-dark">{{ t.designation }}</span>
                    </div>

                    <!-- Name -->
                    <h5 class="card-title mb-1 text-primary">{{ t.name }}</h5>

                    <!-- Department Badge -->
                    <p class="mb-3">
                        <span class="badge rounded-pill bg-light text-dark border">
                            <i class="bi bi-building me-1"></i> {{ getDepName(t.departmentId)}}
                        </span>
                    </p>

                    <!-- Contact Info -->
                    <div class="small">
                        <p class="mb-1 text-secondary">
                            <i class="bi bi-envelope me-2"></i>{{ t.email }}
                        </p>
                        <p class="mb-0 text-secondary">
                            <i class="bi bi-telephone me-2"></i>{{ t.cell }}
                        </p>
                    </div>
                </div>

                <!-- Action Footer       (click)="onEdit(t)"     -->
                <div class="card-footer bg-white d-flex gap-2 py-3">
                    <button class="btn btn-sm btn-outline-primary flex-grow-1" [routerLink]="['/editTeacher', t.id!]">
                        <i class="bi bi-pencil me-1"></i> Edit
                    </button>
                    <button class="btn btn-sm btn-outline-danger flex-grow-1" (click)="remove(t.id!)">
                        <i class="bi bi-trash me-1"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
